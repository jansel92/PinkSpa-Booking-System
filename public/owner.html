<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PinkSpa Owner Dashboard</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="owner-body">
  <section id="loginScreen" class="login-screen">
    <form id="loginForm" class="login-card">
      <img src="/images/PinkSpa.png" alt="PinkSpa Logo" class="login-logo" />
      <h1>Owner Login</h1>
      <p>Manage appointments, services, and prices.</p>
      <label>Email
        <input name="email" type="email" value="admin@pinkspa.com" required />
      </label>
      <label>Password
        <input name="password" type="password" value="PinkSpa123!" required />
      </label>
      <button class="btn primary full" type="submit">Login</button>
      <p id="loginMessage" class="message"></p>
    </form>
  </section>

  <section id="dashboard" class="dashboard hidden">
    <aside class="sidebar">
      <a class="brand" href="/">
        <img src="/images/PinkSpa.png" alt="PinkSpa Logo" class="sidebar-logo" />
      </a>

      <button data-tab="appointments" class="tab active">Appointments</button>
      <button data-tab="services" class="tab">Services & Prices</button>
      <button data-tab="settings" class="tab">Business Settings</button>
      <button id="logoutBtn" class="logout">Logout</button>
    </aside>

    <main class="dash-main">
      <div class="dash-header">
        <div>
          <p class="eyebrow dark">Owner Dashboard</p>
          <h1>Manage PinkSpa</h1>
        </div>
        <a class="btn primary" href="/" target="_blank">View Website</a>
      </div>

      <div class="stats">
        <div><span>Total Requests</span><strong id="statAppointments">0</strong></div>
        <div><span>Pending</span><strong id="statPending">0</strong></div>
        <div><span>Confirmed</span><strong id="statConfirmed">0</strong></div>
        <div><span>Services</span><strong id="statServices">0</strong></div>
      </div>

      <section id="appointmentsTab" class="tab-content">
        <div class="panel">
          <h2>Appointment Requests</h2>
          <div id="appointmentsList"></div>
        </div>
      </section>

      <section id="servicesTab" class="tab-content hidden">
        <div class="grid-two">
          <div class="panel">
            <h2>Add New Service</h2>
            <form id="serviceForm">
              <label>Service Name
                <input name="name" required placeholder="Gel Manicure" />
              </label>
              <label>Category
                <input name="category" required placeholder="Nails, Pedi, Lashes..." />
              </label>
              <label>Price
                <input name="price" required placeholder="$45" />
              </label>
              <label>Duration Minutes
                <input name="duration" type="number" value="60" />
              </label>
              <label>Image URL Optional
                <input name="image" placeholder="Paste image link" />
              </label>
              <button class="btn primary full" type="submit">Add Service</button>
            </form>
          </div>
          <div class="panel">
            <h2>Current Services</h2>
            <div id="servicesList"></div>
          </div>
        </div>
      </section>

      <section id="settingsTab" class="tab-content hidden">
        <div class="panel">
          <h2>Business Settings</h2>
          <form id="settingsForm" class="settings-grid">
            <label>Business Name
              <input name="business_name" required />
            </label>
            <label>City
              <input name="city" required />
            </label>
            <label>Phone
              <input name="phone" required />
            </label>
            <label>Email
              <input name="email" />
            </label>
            <label>Instagram
              <input name="instagram" />
            </label>
            <label>Address
              <input name="address" />
            </label>
            <label>Hours
              <input name="hours" required />
            </label>
            <button class="btn primary full" type="submit">Save Settings</button>
          </form>
          <p id="settingsMessage" class="message"></p>
        </div>
      </section>
    </main>
  </section>

  <script src="/owner.js"></script>
</body>
</html>
