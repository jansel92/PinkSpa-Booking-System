<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leave a Review | PinkSpa</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" type="image/png" href="/images/favicon.png?v=300" />
</head>

<body class="review-page">
  <section class="review-screen">
    <form id="reviewForm" class="review-card">
      <div class="review-brand">
        <img src="/images/PinkSpa.png" alt="PinkSpa Logo" class="review-logo" width="1254" height="1254" decoding="async" />
        <span>PinkSpa</span>
      </div>

      <div class="review-heading">
        <p class="review-eyebrow">Share Your Experience</p>
        <h1>Leave a Review</h1>
        <p>Your feedback helps PinkSpa grow and helps other clients feel confident booking.</p>
      </div>

      <fieldset class="review-stars" aria-label="Rating">
        <legend>Your Rating</legend>
        <div class="review-star-options">
          <input id="rating5" name="rating" type="radio" value="5" required checked />
          <label for="rating5" aria-label="5 stars">★</label>
          <input id="rating4" name="rating" type="radio" value="4" />
          <label for="rating4" aria-label="4 stars">★</label>
          <input id="rating3" name="rating" type="radio" value="3" />
          <label for="rating3" aria-label="3 stars">★</label>
          <input id="rating2" name="rating" type="radio" value="2" />
          <label for="rating2" aria-label="2 stars">★</label>
          <input id="rating1" name="rating" type="radio" value="1" />
          <label for="rating1" aria-label="1 star">★</label>
        </div>
      </fieldset>

      <label>Your Name
        <input name="client_name" required placeholder="Your name" autocomplete="name" />
      </label>

      <label>Your Review
        <textarea name="review_text" required placeholder="Tell us what you loved about your visit..."></textarea>
      </label>

      <button class="btn primary full review-submit" type="submit">Submit Review</button>
      <div id="reviewMessage" class="review-message" aria-live="polite"></div>
    </form>
  </section>

  <script>
    const reviewForm = document.getElementById("reviewForm");
    const reviewMessage = document.getElementById("reviewMessage");
    const nameFromUrl = new URLSearchParams(window.location.search).get("name");

    if (nameFromUrl) {
      reviewForm.elements.client_name.value = nameFromUrl;
    }

    reviewForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const payload = Object.fromEntries(new FormData(e.target).entries());
      reviewMessage.className = "review-message";
      reviewMessage.textContent = "Submitting your review...";

      try {
        const response = await fetch("/api/reviews", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          reviewMessage.className = "review-message is-error";
          reviewMessage.textContent = data.error || "We couldn't submit your review. Please check your information and try again.";
          return;
        }

        e.target.reset();
        reviewMessage.className = "review-message is-success";
        reviewMessage.innerHTML = `
          <strong>Thank you for sharing your experience.</strong>
          <span>Your review was sent to PinkSpa and will be reviewed shortly.</span>
        `;
      } catch (error) {
        console.error("Unable to submit review:", error);
        reviewMessage.className = "review-message is-error";
        reviewMessage.textContent = "We couldn't submit your review. Please check your connection and try again. Your review is still in the form.";
      }
    });
  </script>
</body>
</html>
